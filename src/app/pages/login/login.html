<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">

      <h1 class="text-3xl font-bold text-gray-800">
        Iniciar sesión
      </h1>

      <p class="text-gray-500 mt-2">
        Bienvenido a ACD Hotel
      </p>

    </div>

    <form (ngSubmit)="iniciarSesion()" class="space-y-5">

      <div>

        <label class="block text-sm font-medium text-gray-700 mb-1">
          Correo electrónico
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

      </div>

      <div>

        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

      </div>

      @if (error) {
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        [disabled]="cargando"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition"
      >
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <div class="text-center mt-6">

      <span class="text-gray-500">
        ¿No tienes una cuenta?
      </span>

      <button
        type="button"
        (click)="irRegistro()"
        class="text-blue-600 font-semibold ml-1 hover:underline"
      >
        Regístrate
      </button>

    </div>

  </div>

</div>
