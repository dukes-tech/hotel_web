<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">
        Crear cuenta
      </h1>

      <p class="text-gray-500 mt-2">
        Regístrate en ACD Hotel
      </p>
    </div>

    <form (ngSubmit)="registrar()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nombre
        </label>

        <input
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ingresa tu nombre"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Apellido
        </label>

        <input
          type="text"
          name="apellido"
          [(ngModel)]="apellido"
          placeholder="Ingresa tu apellido"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Correo electrónico
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Confirmar contraseña
        </label>

        <input
          type="password"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          placeholder="Repite tu contraseña"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      @if (error) {
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm">
          {{ error }}
        </div>
      }

      @if (mensaje) {
        <div class="bg-green-50 text-green-600 p-3 rounded-lg text-sm">
          {{ mensaje }}
        </div>
      }

      <button
        type="submit"
        [disabled]="cargando"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition"
      >
        {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
      </button>

    </form>

    <div class="text-center mt-6">
      <span class="text-gray-500">
        ¿Ya tienes una cuenta?
      </span>

      <button
        type="button"
        (click)="irLogin()"
        class="text-blue-600 font-semibold ml-1 hover:underline"
      >
        Iniciar sesión
      </button>
    </div>

  </div>

</div>
