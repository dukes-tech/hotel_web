<section
  class="bg-center bg-no-repeat bg-cover bg-gray-700 bg-blend-multiply"
  [style.background-image]="'url(' + imagen + ')'">

  <div class="px-4 mx-auto max-w-screen-xl text-center py-32 lg:py-48">

    <h1
      class="mb-4 text-4xl font-extrabold tracking-tight leading-none text-white md:text-5xl lg:text-6xl">
      {{ titulo }}
    </h1>

    <p
      class="mb-8 text-lg font-normal text-gray-300 lg:text-xl sm:px-16 lg:px-48">
      {{ descripcion }}
    </p>

  </div>

</section>
