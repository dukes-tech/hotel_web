<div class="min-h-screen bg-gray-100 pt-24 px-6 pb-10">

  <div class="max-w-7xl mx-auto">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-[#123458]">
        Staff
      </h1>

      <p class="text-gray-600 mt-2">
        Personajes obtenidos desde Futurama API
      </p>
    </div>

    @if (cargando) {
      <div class="text-center py-10">
        <p class="text-gray-600 text-lg">
          Cargando personajes...
        </p>
      </div>
    }

    @if (error) {
      <div class="bg-red-100 text-red-700 p-4 rounded-lg mb-6">
        {{ error }}
      </div>
    }

    @if (!cargando && !error) {

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        @for (personaje of personajes; track personaje.id) {

          <div
            class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition">

            <img
              [src]="personaje.image"
              [alt]="personaje.name"
              class="w-full h-64 object-cover"
            >

            <div class="p-5">

              <h2 class="text-xl font-bold text-[#123458]">
                {{ personaje.name }}
              </h2>

              <p class="text-gray-600 mt-2">
                <span class="font-semibold">Género:</span>
                {{ personaje.gender || 'No especificado' }}
              </p>

            </div>

          </div>

        }

      </div>

    }

  </div>

</div>
